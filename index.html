<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>스마트 발전기 리모컨</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #162033;
      --card-border: #263552;
      --text: #f8fafc;
      --sub: #94a3b8;
      --accent: #3b82f6;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --purple: #8b5cf6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 480px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 14px;
    }
    .status-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
    }
    .status-wrap:active {
      transform: scale(0.96);
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      transition: 0.3s;
    }
    .status-dot.on {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }
    .status-dot.wait {
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
    }
    .status-text {
      font-size: 15px;
      font-weight: 700;
    }
    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-btn:active {
      transform: scale(0.96);
    }
    .gauge-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .gauge-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
      position: relative;
    }
    .gauge-label {
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .gauge-val {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .gauge-unit {
      font-size: 13px;
      color: var(--sub);
      font-weight: 600;
      margin-left: 2px;
    }
    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: #1e293b;
      color: var(--sub);
    }
    .badge.run {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .badge.charge {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }
    .ctrl-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .act-btn {
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 14px;
      padding: 18px 12px;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: 0.2s;
    }
    .act-btn:active:not(:disabled) {
      transform: scale(0.97);
    }
    .act-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.5);
    }
    .act-sub {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.9;
    }
    .btn-preheat {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }
    .btn-start {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      padding: 20px;
      font-size: 21px;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
    }
    .prog-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 6px;
      width: 0%;
      background: rgba(255, 255, 255, 0.85);
      transition: width 0.1s linear;
    }
    .timer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--sub);
    }
    .timer-remain {
      font-size: 20px;
      font-weight: 800;
      color: var(--amber);
    }
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .t-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: 11px 6px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .t-btn.clear {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.4);
    }
    .t-btn:active {
      transform: scale(0.95);
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 999;
    }
    .modal-backdrop.show {
      display: flex;
    }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slider-top {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      height: 6px;
    }
    .pin-input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 8px;
    }
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .m-btn {
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .m-btn.cancel {
      background: #334155;
      color: #fff;
    }
    .m-btn.confirm {
      background: var(--accent);
      color: #fff;
    }
  </style>
  <script src="ble-native-adapter.js?v=4"></script>
</head>
<body>

  <div class="top-bar">
    <button id="statusBtn" type="button" class="status-wrap" onclick="handleConnectClick()">
      <div id="statusDot" class="status-dot"></div>
      <div id="statusText" class="status-text">연결하기</div>
    </button>
    <button class="icon-btn" onclick="openSettingsModal()">⚙️ 설정</button>
  </div>

  <div class="gauge-grid">
    <div class="gauge-card">
      <div class="gauge-label">발전기 AC 전압</div>
      <div><span id="valAc" class="gauge-val">--</span><span class="gauge-unit">V</span></div>
      <div id="badgeRun" class="badge">정지 대기</div>
    </div>
    <div class="gauge-card">
      <div class="gauge-label">주파수</div>
      <div><span id="valHz" class="gauge-val">--</span><span class="gauge-unit">Hz</span></div>
      <div id="badgeHz" class="badge">60Hz 기준</div>
    </div>
    <div class="gauge-card">
      <div class="gauge-label">배터리 DC</div>
      <div><span id="valDc" class="gauge-val">--</span><span class="gauge-unit">V</span></div>
      <div id="badgeCharge" class="badge">대기</div>
    </div>
  </div>

  <div class="ctrl-card">
    <div class="btn-row">
      <button id="btnPreheat" class="act-btn btn-preheat" onclick="triggerPreheat()" disabled>
        <span>🔥 예열 시작</span>
        <span id="subPreheat" class="act-sub">설정: 8.0초</span>
        <div id="progPreheat" class="prog-bar"></div>
      </button>

      <button id="btnStart" class="act-btn btn-start" onclick="triggerStart()" disabled>
        <span>⚡ 시동 (크랭킹)</span>
        <span id="subStart" class="act-sub">설정: 0.9초</span>
        <div id="progStart" class="prog-bar"></div>
      </button>
    </div>

    <button id="btnStop" class="act-btn btn-stop" onclick="triggerStop()" disabled>
      <span>정지</span>
    </button>
  </div>

  <div class="ctrl-card">
    <div class="timer-header">
      <span class="timer-title">⏱️ 자동 정지 타이머</span>
      <span id="valAutoStop" class="timer-remain">꺼짐</span>
    </div>
    <div class="timer-grid">
      <button class="t-btn" onclick="addAutoStop(600)">+10분</button>
      <button class="t-btn" onclick="addAutoStop(1800)">+30분</button>
      <button class="t-btn" onclick="addAutoStop(3600)">+1시간</button>
      <button class="t-btn clear" onclick="addAutoStop(0)">취소</button>
    </div>
  </div>

  <div id="pinModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-title">🔒 발전기 비밀번호 입력</div>
      <div id="pinDesc" style="font-size:14px; color:var(--sub);">
        선택한 발전기 이름의 맨 뒤 숫자 4자리를 입력하세요.
      </div>
      <input id="pinInput" type="tel" maxlength="4" class="pin-input" placeholder="0000" />
      <div class="modal-actions">
        <button class="m-btn cancel" onclick="cancelPinModal()">취소</button>
        <button class="m-btn confirm" onclick="confirmPinModal()">확인</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-title">⚙️ 시간 설정 (ESP 저장)</div>

      <div class="slider-group">
        <div class="slider-top">
          <span>예열 유지 시간</span>
          <span id="lblSetPreheat">8.0초</span>
        </div>
        <input id="rngPreheat" type="range" min="1.0" max="20.0" step="0.5" value="8.0"
               oninput="document.getElementById('lblSetPreheat').innerText = parseFloat(this.value).toFixed(1) + '초'"
               onchange="saveRelay1(this.value)" />
      </div>

      <div class="slider-group">
        <div class="slider-top">
          <span>시동 모터 시간 (최대 4.8초 보호)</span>
          <span id="lblSetStart">0.9초</span>
        </div>
        <input id="rngStart" type="range" min="0.3" max="4.8" step="0.1" value="0.9"
               oninput="document.getElementById('lblSetStart').innerText = parseFloat(this.value).toFixed(1) + '초'"
               onchange="saveRelay2(this.value)" />
      </div>

      <button class="m-btn cancel" style="width:100%;" onclick="resetSavedDevice()">🔄 저장된 발전기 인증/자동연결 초기화</button>
      <button class="m-btn confirm" style="width:100%;" onclick="closeSettingsModal()">닫기</button>
    </div>
  </div>

  <div id="errModal" class="modal-backdrop">
    <div class="modal-box" style="border-color: var(--red); text-align: center;">
      <div class="modal-title" style="color: var(--red); font-size: 22px;">⚠️ 시스템 오류</div>
      <div style="font-size: 16px; line-height: 1.6; margin: 8px 0;">
        제어기 통신 및 모듈 점검이 필요합니다.<br/>
        <strong style="color: #f87171; font-size: 20px;">오류코드: x3303</strong>
      </div>
    </div>
  </div>

  <script>
    const SERVICE_UUID        = "12345678-1234-1234-1234-1234567890ab";
    const CHARACTERISTIC_UUID = "abcdefab-1234-5678-1234-abcdefabcdef";

    let bleDevice       = null;
    let bleChar         = null;
    let isConnected     = false;
    let isReconnecting  = false;
    let autoReconTimer  = null;
    let sysLocked       = false;
    let lastCleanName   = "";

    let setPreheatSec = 8.0;
    let setStartSec   = 0.9;
    let curAcVolt     = 0;
    let curHz         = 0.0;
    let curStep1      = 0;

    let cmdQueue = Promise.resolve();
    let pendingPinResolve = null;
    let preheatAnimTimer  = null;
    let startAnimTimer    = null;

    function sanitizeSsid(raw) {
      return String(raw || "").replace(/["'\s]/g, "").trim();
    }

    function extractPinFromName(name) {
      const digits = String(name || "").replace(/\D/g, "");
      return digits.length >= 4 ? digits.slice(-4) : "0000";
    }

    function getStampStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}${m}${day}`;
    }

    function getSavedBleName() {
      const savedName = localStorage.getItem("ble_last_name") || localStorage.getItem("ble_native_device_name") || "";
      const savedId   = localStorage.getItem("ble_last_id") || localStorage.getItem("ble_native_device_id") || "";
      if (!savedName || !savedId) return "";
      const expectedPin = extractPinFromName(savedName);
      if (localStorage.getItem("ble_auth_" + savedName) !== expectedPin) return "";
      return savedName;
    }

    async function sendBleCmd(cmd, preferNoResp = false) {
      if (!bleChar || !isConnected || sysLocked) return;
      cmdQueue = cmdQueue.then(async () => {
        if (!bleChar || !isConnected || sysLocked) return;
        try {
          const enc = new TextEncoder();
          const data = enc.encode(cmd);
          if (preferNoResp && bleChar.writeValueWithoutResponse) {
            await bleChar.writeValueWithoutResponse(data);
          } else {
            await bleChar.writeValue(data);
          }
          await new Promise(r => setTimeout(r, 35));
        } catch (e) {
          console.warn("BLE write err:", e);
        }
      });
      return cmdQueue;
    }

    // ★ GATT 서버 연결 및 알림 구독 공통 함수 (첫 연결 및 자동 재연결 공용)
    async function connectGattAndSubscribe(device, cleanName) {
      if (sysLocked) return false;
      try {
        bleDevice = device;
        lastCleanName = cleanName || sanitizeSsid(device.name || localStorage.getItem("ble_last_name") || "korea0000");

        bleDevice.removeEventListener("gattserverdisconnected", onDisconnected);
        bleDevice.addEventListener("gattserverdisconnected", onDisconnected);

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleChar = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await bleChar.startNotifications();
        bleChar.removeEventListener("characteristicvaluechanged", onBleNotify);
        bleChar.addEventListener("characteristicvaluechanged", onBleNotify);

        isConnected = true;
        isReconnecting = false;
        if (autoReconTimer) {
          clearTimeout(autoReconTimer);
          autoReconTimer = null;
        }

        localStorage.setItem("ble_last_name", lastCleanName);
        if (device.id) localStorage.setItem("ble_last_id", device.id);

        updateConnectionUi(lastCleanName);

        await sendBleCmd("DATE_" + getStampStr());
        await sendBleCmd("REQ_SYNC");
        return true;
      } catch (err) {
        return false;
      }
    }

    // ★ 거리가 멀어지거나 순간 노이즈로 끊어졌을 때 가까워지면 자동으로 다시 붙는 루프
    function scheduleAutoReconnect() {
      if (sysLocked || isConnected || !bleDevice) return;
      if (autoReconTimer) clearTimeout(autoReconTimer);

      isReconnecting = true;
      updateConnectionUi(lastCleanName);

      autoReconTimer = setTimeout(async () => {
        if (sysLocked || isConnected || !bleDevice) return;
        const ok = await connectGattAndSubscribe(bleDevice, lastCleanName);
        if (!ok && !isConnected && !sysLocked) {
          scheduleAutoReconnect();
        }
      }, 1800);
    }

    // ★ 웹앱 실행 시 이전에 직접 선택하고 비밀번호 4자리 인증까지 완료한 '마지막 발전기'만 자동 접속 시도
    async function tryAutoConnectSavedDevice() {
      if (sysLocked || isConnected || !navigator.bluetooth) {
        updateConnectionUi(lastCleanName);
        return;
      }
      const savedName = getSavedBleName();
      const savedId   = localStorage.getItem("ble_last_id") || localStorage.getItem("ble_native_device_id") || "";
      if (!savedName || !savedId) {
        updateConnectionUi("");
        return;
      }

      lastCleanName = savedName;
      isReconnecting = true;
      updateConnectionUi(savedName);

      if (typeof navigator.bluetooth.getDevices === "function") {
        try {
          const devices = await navigator.bluetooth.getDevices();
          if (devices && devices.length > 0) {
            let target = devices.find(d => (savedId && d.id === savedId) || sanitizeSsid(d.name) === savedName) || devices[0];
            if (target) {
              const tName = sanitizeSsid(target.name || savedName);
              lastCleanName = tName;
              bleDevice = target;
              updateConnectionUi(tName);
              const ok = await connectGattAndSubscribe(target, tName);
              if (!ok) {
                if (typeof target.watchAdvertisements === "function") {
                  target.addEventListener("advertisementreceived", async () => {
                    if (!isConnected && !sysLocked) {
                      await connectGattAndSubscribe(target, tName);
                    }
                  });
                  try { await target.watchAdvertisements(); } catch (e) {}
                }
                scheduleAutoReconnect();
              }
            }
          }
        } catch (e) {
          console.warn("Auto getDevices err:", e);
        }
      }
    }

    async function handleConnectClick() {
      if (sysLocked) return;
      if (!navigator.bluetooth) {
        alert("이 브라우저는 블루투스(WebBLE)를 지원하지 않습니다. 안드로이드 Chrome 브라우저로 열어주세요.");
        return;
      }

      // 이미 연결된 상태에서는 이름만 유지하고 상태 동기화만 수행 (다른 발전기 변경은 설정 화면에서)
      if (isConnected && bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
        await sendBleCmd("REQ_SYNC");
        return;
      }

      // 저장된 발전기 객체가 있으면 먼저 즉시 재연결 시도
      if (bleDevice) {
        isReconnecting = true;
        updateConnectionUi(lastCleanName);
        const ok = await connectGattAndSubscribe(bleDevice, lastCleanName);
        if (ok) return;
      }

      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "korea" }],
          optionalServices: [SERVICE_UUID]
        });

        const cleanName = sanitizeSsid(device.name || "korea0000");
        const expectedPin = extractPinFromName(cleanName);
        const savedAuth = localStorage.getItem("ble_auth_" + cleanName);

        if (savedAuth !== expectedPin) {
          const userPin = await askPinModal(cleanName);
          if (userPin === null) {
            updateConnectionUi(lastCleanName);
            return;
          }
          const cleanInput = String(userPin).replace(/\D/g, "").slice(-4);
          if (cleanInput !== expectedPin) {
            alert("비밀번호 4자리가 일치하지 않습니다.");
            updateConnectionUi(lastCleanName);
            return;
          }
          localStorage.setItem("ble_auth_" + cleanName, expectedPin);
        }

        if (autoReconTimer) {
          clearTimeout(autoReconTimer);
          autoReconTimer = null;
        }
        if (bleDevice && bleDevice.id !== device.id && bleDevice.gatt) {
          try { bleDevice.gatt.disconnect(); } catch (e) {}
        }

        lastCleanName = cleanName;
        isReconnecting = true;
        updateConnectionUi(cleanName);

        const ok = await connectGattAndSubscribe(device, cleanName);
        if (!ok) {
          scheduleAutoReconnect();
        }
      } catch (err) {
        console.warn("BLE connect canceled/failed:", err);
        updateConnectionUi(lastCleanName);
      }
    }

    function onDisconnected() {
      isConnected = false;
      bleChar = null;
      updateConnectionUi(lastCleanName);
      // ★ 끊어지면 포기하지 않고 가까워질 때까지 자동 재접속 루프 가동!
      if (!sysLocked && bleDevice) {
        scheduleAutoReconnect();
      }
    }

    function updateConnectionUi(devName) {
      const dot = document.getElementById("statusDot");
      const txt = document.getElementById("statusText");
      const hasSaved = Boolean(getSavedBleName() || bleDevice || isReconnecting);

      if (isConnected && !sysLocked) {
        dot.className = "status-dot on";
        txt.innerText = devName || lastCleanName || "연결됨";
        document.getElementById("btnStop").disabled = false;
        updateActionButtonsLock();
      } else if (sysLocked) {
        dot.className = "status-dot";
        txt.innerText = "시스템 잠금 (x3303)";
        document.getElementById("btnPreheat").disabled = true;
        document.getElementById("btnStart").disabled = true;
        document.getElementById("btnStop").disabled = true;
        document.getElementById("valAc").innerText = "--";
        document.getElementById("valHz").innerText = "--";
        document.getElementById("valDc").innerText = "--";
      } else if (hasSaved) {
        dot.className = "status-dot wait";
        txt.innerText = "연결 중";
        document.getElementById("btnPreheat").disabled = true;
        document.getElementById("btnStart").disabled = true;
        document.getElementById("btnStop").disabled = true;
      } else {
        dot.className = "status-dot";
        txt.innerText = "연결하기";
        document.getElementById("btnPreheat").disabled = true;
        document.getElementById("btnStart").disabled = true;
        document.getElementById("btnStop").disabled = true;
        document.getElementById("valAc").innerText = "--";
        document.getElementById("valHz").innerText = "--";
        document.getElementById("valDc").innerText = "--";
      }
    }

    function triggerLockdown() {
      sysLocked = true;
      isReconnecting = false;
      if (autoReconTimer) {
        clearTimeout(autoReconTimer);
        autoReconTimer = null;
      }
      document.getElementById("errModal").classList.add("show");
      if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
        try { bleDevice.gatt.disconnect(); } catch (e) {}
      }
      bleDevice = null;
      onDisconnected();
    }

    function onBleNotify(event) {
      const dec = new TextDecoder("utf-8");
      const raw = dec.decode(event.target.value).trim();
      if (!raw) return;

      const lines = raw.split(/\r?\n/);
      for (const line of lines) {
        parsePacket(line.trim());
      }
    }

    function parsePacket(msg) {
      if (msg === "err_x3303") {
        triggerLockdown();
        return;
      }
      if (sysLocked) return;

      if (msg.startsWith("r1_")) {
        const v = parseFloat(msg.substring(3));
        if (!isNaN(v)) {
          setPreheatSec = v;
          document.getElementById("subPreheat").innerText = `설정: ${v.toFixed(1)}초`;
          document.getElementById("lblSetPreheat").innerText = `${v.toFixed(1)}초`;
          document.getElementById("rngPreheat").value = v;
        }
      } else if (msg.startsWith("r2_")) {
        const v = parseFloat(msg.substring(3));
        if (!isNaN(v)) {
          setStartSec = v;
          document.getElementById("subStart").innerText = `설정: ${v.toFixed(1)}초`;
          document.getElementById("lblSetStart").innerText = `${v.toFixed(1)}초`;
          document.getElementById("rngStart").value = v;
        }
      } else if (msg.startsWith("off_")) {
        const sec = parseInt(msg.substring(4), 10) || 0;
        renderAutoStopRemain(sec);
      } else if (msg.startsWith("st_")) {
        const parts = msg.substring(3).split(",");
        if (parts.length >= 6) {
          curAcVolt      = parseFloat(parts[0]) || 0;
          curHz          = parseFloat(parts[1]) || 0;
          const dcBatt   = parseFloat(parts[2]) || 0;
          const charging = parseInt(parts[3], 10) === 1;
          curStep1       = parseInt(parts[4], 10) === 1 ? 1 : 0;
          const remSec   = parseInt(parts[5], 10) || 0;

          document.getElementById("valAc").innerText = curAcVolt.toFixed(0);
          document.getElementById("valHz").innerText = curHz.toFixed(1);
          document.getElementById("valDc").innerText = dcBatt.toFixed(1);

          const isAcAlive = (curAcVolt >= 15 || curHz >= 10);
          const badgeRun = document.getElementById("badgeRun");
          if (curAcVolt >= 160 || curHz >= 45) {
            badgeRun.innerText = "발전 운전 중";
            badgeRun.className = "badge run";
          } else if (isAcAlive) {
            badgeRun.innerText = "AC 감지됨";
            badgeRun.className = "badge run";
          } else {
            badgeRun.innerText = "정지 대기";
            badgeRun.className = "badge";
          }

          const badgeCharge = document.getElementById("badgeCharge");
          if (charging) {
            badgeCharge.innerText = "⚡ 충전 중";
            badgeCharge.className = "badge charge";
          } else {
            badgeCharge.innerText = "대기";
            badgeCharge.className = "badge";
          }

          renderAutoStopRemain(remSec);
          updateActionButtonsLock();
        }
      }
    }

    function updateActionButtonsLock() {
      if (!isConnected || sysLocked) return;
      const acDetected = (curAcVolt >= 15 || curHz >= 10);
      document.getElementById("btnPreheat").disabled = acDetected;
      document.getElementById("btnStart").disabled   = acDetected;
    }

    function renderAutoStopRemain(sec) {
      const el = document.getElementById("valAutoStop");
      if (!sec || sec <= 0) {
        el.innerText = "꺼짐";
        return;
      }
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      el.innerText = `${m}분 ${String(s).padStart(2, "0")}초`;
    }

    function runPerformanceBar(barId, durationSec) {
      const bar = document.getElementById(barId);
      if (!bar) return null;
      const totalMs = durationSec * 1000;
      const startMs = Date.now();
      bar.style.width = "0%";
      const timer = setInterval(() => {
        const elapsed = Date.now() - startMs;
        const pct = Math.min(100, (elapsed / totalMs) * 100);
        bar.style.width = pct + "%";
        if (pct >= 100) {
          clearInterval(timer);
          setTimeout(() => { bar.style.width = "0%"; }, 250);
        }
      }, 80);
      return timer;
    }

    function triggerPreheat() {
      if (curAcVolt >= 15 || curHz >= 10) return;
      if (preheatAnimTimer) clearInterval(preheatAnimTimer);
      preheatAnimTimer = runPerformanceBar("progPreheat", setPreheatSec);
      sendBleCmd("CMD_PREHEAT");
    }

    function triggerStart() {
      if (curAcVolt >= 15 || curHz >= 10) return;
      if (startAnimTimer) clearInterval(startAnimTimer);
      startAnimTimer = runPerformanceBar("progStart", setStartSec + 1.0);
      sendBleCmd("CMD_START");
    }

    function triggerStep1() {
      if (curAcVolt >= 15 || curHz >= 10) return;
      sendBleCmd("CMD_STEP1");
    }

    function triggerStop() {
      if (preheatAnimTimer) clearInterval(preheatAnimTimer);
      if (startAnimTimer) clearInterval(startAnimTimer);
      document.getElementById("progPreheat").style.width = "0%";
      document.getElementById("progStart").style.width = "0%";
      // ★ 정지 명령은 응답 대기 중 노이즈 충돌을 피하기 위해 WriteWithoutResponse 우선 사용
      sendBleCmd("CMD_STOP_" + getStampStr(), true);
    }

    function addAutoStop(sec) {
      sendBleCmd("OFF_ADD_" + sec);
    }

    function saveRelay1(val) {
      sendBleCmd("RELAY1_" + parseFloat(val).toFixed(1));
    }

    function saveRelay2(val) {
      let v = parseFloat(val);
      if (v > 4.8) v = 4.8;
      sendBleCmd("RELAY2_" + v.toFixed(1));
    }

    function askPinModal(devName) {
      return new Promise((resolve) => {
        pendingPinResolve = resolve;
        document.getElementById("pinDesc").innerText =
          `선택한 발전기(${devName})의 맨 뒤 숫자 4자리를 입력하세요.`;
        const inp = document.getElementById("pinInput");
        inp.value = "";
        document.getElementById("pinModal").classList.add("show");
        setTimeout(() => inp.focus(), 100);
      });
    }

    function cancelPinModal() {
      document.getElementById("pinModal").classList.remove("show");
      if (pendingPinResolve) pendingPinResolve(null);
      pendingPinResolve = null;
    }

    function confirmPinModal() {
      const val = document.getElementById("pinInput").value;
      document.getElementById("pinModal").classList.remove("show");
      if (pendingPinResolve) pendingPinResolve(val);
      pendingPinResolve = null;
    }

    function openSettingsModal() {
      if (sysLocked) return;
      document.getElementById("settingsModal").classList.add("show");
    }

    function closeSettingsModal() {
      document.getElementById("settingsModal").classList.remove("show");
    }

    async function resetSavedDevice() {
      if (autoReconTimer) {
        clearTimeout(autoReconTimer);
        autoReconTimer = null;
      }
      isReconnecting = false;
      isConnected = false;
      bleChar = null;
      if (bleDevice) {
        try {
          bleDevice.removeEventListener("gattserverdisconnected", onDisconnected);
          if (bleDevice.gatt) bleDevice.gatt.disconnect();
        } catch (e) {}
      }
      bleDevice = null;
      lastCleanName = "";
      if (typeof window.__bleNativeReset === "function") {
        try { await window.__bleNativeReset(); } catch (e) {}
      }
      try { localStorage.clear(); } catch (e) {}
      closeSettingsModal();
      updateConnectionUi("");
      alert("저장된 발전기 인증 및 자동 연결 정보가 초기화되었습니다.");
    }

    // 페이지가 열릴 때 기억된 발전기로 자동 연결 시도 + 화면 복귀 시 즉시 재연결 체크
    window.addEventListener("DOMContentLoaded", () => {
      tryAutoConnectSavedDevice();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && !isConnected && !sysLocked && bleDevice) {
        scheduleAutoReconnect();
      }
    });
  </script>
</body>
</html>
