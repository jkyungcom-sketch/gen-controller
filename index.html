<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>스마트 발전기 리모컨</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #162033;
      --card-border: #263552;
      --text: #f8fafc;
      --sub: #94a3b8;
      --accent: #3b82f6;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --purple: #8b5cf6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 480px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 14px;
    }
    .status-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
    }
    .status-wrap:active {
      transform: scale(0.96);
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      transition: 0.3s;
    }
    .status-dot.on {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }
    .status-dot.wait {
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
    }
    .status-text {
      font-size: 15px;
      font-weight: 700;
    }
    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .icon-btn:active:not(:disabled) {
      transform: scale(0.96);
    }
    .icon-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.5);
    }

    /* ══════ 3단 수평(2줄) 실측 계기판 ══════ */
    .cond-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cond-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .cond-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .cond-title {
      font-size: 13px;
      font-weight: 800;
      color: #cbd5e1;
      white-space: nowrap;
      min-width: 82px;
    }
    .cond-slider-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cond-scale {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      padding: 0 2px;
    }
    .cond-scale .sc-min { color: #f87171; }
    .cond-scale .sc-mid { color: #e2e8f0; }
    .cond-scale .sc-max { color: #60a5fa; }
    .cond-track {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ef4444 0%, #10b981 50%, #3b82f6 100%);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
    }
    .cond-mid-tick {
      position: absolute;
      left: 50%;
      top: -2px;
      bottom: -2px;
      width: 2px;
      background: rgba(255, 255, 255, 0.45);
      transform: translateX(-50%);
      border-radius: 1px;
    }
    .cond-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
      transform: translate(-50%, -50%);
    }
    .cond-row-bot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .cond-sub-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--sub);
    }
    .ac-bolt {
      display: inline-block;
      color: #facc15;
      font-size: 15px;
      filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.8));
    }
    .cond-val-wrap {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }
    .cond-val {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .cond-unit {
      font-size: 13px;
      font-weight: 700;
      color: var(--sub);
    }

    /* 배터리 대기중 / 충전중 상태 뱃지 */
    .batt-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-right: 8px;
      padding: 2px 9px;
      border-radius: 999px;
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 11px;
      font-weight: 800;
      color: var(--sub);
    }
    .batt-status.charging {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.45);
      color: #34d399;
    }
    .chg-lamp {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
    }
    .batt-status.charging .chg-lamp {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: lampBlink 0.65s infinite alternate;
    }
    @keyframes lampBlink {
      0%   { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1;   transform: scale(1.2); box-shadow: 0 0 12px #34d399; }
    }

    /* 전압/주파수/배터리 0V 회색 비활성 상태 */
    .cond-card.is-off {
      border-color: #1e293b;
      background: #111827;
    }
    .cond-card.is-off .cond-title,
    .cond-card.is-off .cond-sub-label,
    .cond-card.is-off .cond-val,
    .cond-card.is-off .cond-unit,
    .cond-card.is-off .cond-scale span {
      color: #475569 !important;
    }
    .cond-card.is-off .cond-track {
      background: #1e293b !important;
    }
    .cond-card.is-off .cond-thumb {
      background: #475569 !important;
      border-color: #334155 !important;
      box-shadow: none !important;
    }
    .cond-card.is-off .ac-bolt {
      color: #475569 !important;
      filter: none !important;
    }
    .cond-card.is-off .batt-status {
      background: #1e293b !important;
      border-color: #1e293b !important;
      color: #475569 !important;
    }
    .cond-card.is-off .chg-lamp {
      background: #475569 !important;
      box-shadow: none !important;
      animation: none !important;
    }

    /* ══════ 예열 / 시동 / 예약정지 / 즉시정지 컨트롤 카드 ══════ */
    .ctrl-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .action-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 12px;
    }
    .action-slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .action-slider-label {
      font-size: 14px;
      font-weight: 800;
      color: #cbd5e1;
      white-space: nowrap;
      min-width: 64px;
    }
    /* 홈 화면 슬라이더는 안전장치로 직접 조작 불가 (표시 및 카운트다운 전용) */
    .action-range {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      pointer-events: none;
    }
    .action-range.preheat-range {
      accent-color: var(--amber);
    }
    .action-range.start-range {
      accent-color: var(--green);
    }
    .act-btn {
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 12px;
      padding: 16px 12px;
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
      width: 100%;
      font-variant-numeric: tabular-nums;
    }
    .act-btn:active:not(:disabled) {
      transform: scale(0.98);
    }
    .act-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.5);
    }
    /* 가동 중일 때는 버튼이 어두워지지 않고 선명하게 표시 */
    .act-btn.running-display:disabled {
      opacity: 1;
      filter: none;
    }
    .btn-preheat {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }
    .btn-start {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    /* 위 예열/시동 버튼(.action-block 내부 폭)과 좌우 폭을 100% 동일하게 맞춤 */
    .btn-same-width {
      width: calc(100% - 26px);
      margin: 0 auto;
    }
    .btn-reserve {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 16px 12px;
      font-size: 19px;
      color: #e2e8f0;
    }
    .btn-reserve.active-cancel {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      border-color: #a78bfa;
      color: #ffffff;
    }
    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      padding: 16px 12px;
      font-size: 19px;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
    }

    /* ══════ 전체화면 창 (설정 & 예약 정지 설정 전용) ══════ */
    .fullscreen-modal {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px 18px;
      z-index: 999;
      overflow-y: auto;
    }
    .fullscreen-modal.show {
      display: flex;
    }
    .fs-inner {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }
    .fs-header {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
    }
    .fs-body {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      flex: 1;
      justify-content: center;
    }
    .fs-footer {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 18px 16px;
    }
    .slider-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .modal-range {
      width: 100%;
      accent-color: var(--accent);
      height: 10px;
      cursor: pointer;
    }
    .preset-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .t-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: 16px 8px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .t-btn:active {
      transform: scale(0.96);
    }

    /* ══════ 일반 팝업 (비밀번호 / 오류창) ══════ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 1000;
    }
    .modal-backdrop.show {
      display: flex;
    }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
    }
    .pin-input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 8px;
    }
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .m-btn {
      padding: 16px;
      border-radius: 12px;
      border: none;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .m-btn:active {
      transform: scale(0.97);
    }
    .m-btn.cancel {
      background: #334155;
      color: #fff;
    }
    .m-btn.confirm {
      background: var(--accent);
      color: #fff;
    }
    .m-btn.danger {
      background: #7f1d1d;
      border: 1px solid #dc2626;
      color: #fecaca;
    }
  </style>
  <script src="ble-native-adapter.js?v=4"></script>
</head>
<body>

  <div class="top-bar">
    <button id="statusBtn" type="button" class="status-wrap" onclick="handleConnectClick()">
      <div id="statusDot" class="status-dot"></div>
      <div id="statusText" class="status-text">연결하기</div>
    </button>
    <button id="btnSettings" class="icon-btn" onclick="openSettingsModal()" disabled>⚙️ 설정</button>
  </div>

  <!-- 3단 수평(2줄) 실측 계기판 -->
  <div class="cond-stack">
    <!-- 1. 전압 컨디션 (400V ~ 440V ~ 480V) -->
    <div id="cardAc" class="cond-card is-off">
      <div class="cond-row-top">
        <span class="cond-title">전압 컨디션</span>
        <div class="cond-slider-wrap">
          <div class="cond-scale">
            <span class="sc-min">400V</span>
            <span class="sc-mid">440V</span>
            <span class="sc-max">480V</span>
          </div>
          <div class="cond-track">
            <div class="cond-mid-tick"></div>
            <div id="thumbAc" class="cond-thumb" style="left: 0%;"></div>
          </div>
        </div>
      </div>
      <div class="cond-row-bot">
        <span class="cond-sub-label"><span class="ac-bolt">⚡</span>발전기 전압 AC</span>
        <div class="cond-val-wrap">
          <span id="valAc" class="cond-val">0</span>
          <span class="cond-unit">V</span>
        </div>
      </div>
    </div>

    <!-- 2. 엔진 컨디션 (57Hz ~ 60Hz ~ 63Hz) -->
    <div id="cardHz" class="cond-card is-off">
      <div class="cond-row-top">
        <span class="cond-title">엔진 컨디션</span>
        <div class="cond-slider-wrap">
          <div class="cond-scale">
            <span class="sc-min">57</span>
            <span class="sc-mid">60</span>
            <span class="sc-max">63</span>
          </div>
          <div class="cond-track">
            <div class="cond-mid-tick"></div>
            <div id="thumbHz" class="cond-thumb" style="left: 0%;"></div>
          </div>
        </div>
      </div>
      <div class="cond-row-bot">
        <span class="cond-sub-label">주파수</span>
        <div class="cond-val-wrap">
          <span id="valHz" class="cond-val">0.0</span>
          <span class="cond-unit">Hz</span>
        </div>
      </div>
    </div>

    <!-- 3. 밧데리 컨디션 (10V ~ 13V ~ 15V) -->
    <div id="cardDc" class="cond-card is-off">
      <div class="cond-row-top">
        <span class="cond-title">밧데리 컨디션</span>
        <div class="cond-slider-wrap">
          <div class="cond-scale">
            <span class="sc-min">10</span>
            <span class="sc-mid">13</span>
            <span class="sc-max">15</span>
          </div>
          <div class="cond-track">
            <div class="cond-mid-tick"></div>
            <div id="thumbDc" class="cond-thumb" style="left: 0%;"></div>
          </div>
        </div>
      </div>
      <div class="cond-row-bot">
        <span class="cond-sub-label">밧데리 전압 DC</span>
        <div style="display:flex; align-items:center;">
          <span id="chgBadge" class="batt-status"><span class="chg-lamp"></span><span id="chgText">대기중</span></span>
          <div class="cond-val-wrap">
            <span id="valDc" class="cond-val">0.0</span>
            <span class="cond-unit">V</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 예열 / 시동 / 예약정지 / 즉시정지 컨트롤 카드 -->
  <div class="ctrl-card">
    <!-- 예열시간 슬라이더(안전잠금 표시전용, 기본 8초) + 예열 버튼 -->
    <div class="action-block">
      <div class="action-slider-row">
        <span class="action-slider-label">예열시간</span>
        <input id="rngPreheat" class="action-range preheat-range" type="range" min="0" max="20.0" step="0.5" value="8.0" tabindex="-1" />
      </div>
      <button id="btnPreheat" class="act-btn btn-preheat" onclick="triggerPreheat()" disabled>
        <span id="txtPreheat">예열 8초</span>
      </button>
    </div>

    <!-- 시동시간 슬라이더(안전잠금 표시전용, 기본 0.8초, 최대 4.0초) + 시동 버튼 -->
    <div class="action-block">
      <div class="action-slider-row">
        <span class="action-slider-label">시동시간</span>
        <input id="rngStart" class="action-range start-range" type="range" min="0" max="4.0" step="0.1" value="0.8" tabindex="-1" />
      </div>
      <button id="btnStart" class="act-btn btn-start" onclick="triggerStart()" disabled>
        <span id="txtStart">시동 0.8초</span>
      </button>
    </div>

    <!-- 예약 정지 설정 / 예약 정지 취소 버튼 (위 시동버튼과 동일 폭) -->
    <button id="btnReserveStop" class="act-btn btn-reserve btn-same-width" onclick="handleReserveBtnClick()" disabled>
      <span id="txtReserveStop">예약 정지 설정 00:00:00</span>
    </button>

    <!-- 즉시 정지 버튼 (위 시동버튼과 동일 폭·크기) -->
    <button id="btnStop" class="act-btn btn-stop btn-same-width" onclick="triggerStop()" disabled>
      <span>즉시 정지</span>
    </button>
  </div>

  <!-- ══════ [전체화면] 예약 정지 설정 창 ══════ -->
  <div id="reserveModal" class="fullscreen-modal">
    <div class="fs-inner">
      <div class="fs-header">⏱️ 예약 정지 설정</div>

      <div class="fs-body">
        <div class="slider-group">
          <div class="slider-top">
            <span>정지 예약 시간 (최대 12시간)</span>
            <span id="lblReserveModalTime" style="color: var(--amber); font-size: 22px; font-weight: 900;">00:00:00</span>
          </div>
          <input id="rngReserveSec" class="modal-range" type="range" min="0" max="43200" step="60" value="0"
                 oninput="onReserveSliderChange(this.value)" />
        </div>

        <div class="preset-grid-3">
          <button type="button" class="t-btn" onclick="addReserveDraftSec(60)">1분</button>
          <button type="button" class="t-btn" onclick="addReserveDraftSec(900)">15분</button>
          <button type="button" class="t-btn" onclick="addReserveDraftSec(3600)">1시간</button>
        </div>
      </div>

      <div class="fs-footer">
        <div class="modal-actions">
          <button type="button" class="m-btn cancel" onclick="closeReserveModal()">취소</button>
          <button type="button" class="m-btn confirm" onclick="confirmReserveModal()">설정</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════ [전체화면] 설정 창 (예열 8초 / 시동 0.8초·최대 4초) ══════ -->
  <div id="settingsModal" class="fullscreen-modal">
    <div class="fs-inner">
      <div class="fs-header">⚙️ 설정</div>

      <div class="fs-body">
        <div class="slider-group">
          <div class="slider-top">
            <span>예열시간 설정</span>
            <span id="lblModalPreheat" style="color: var(--amber); font-size: 20px;">8.0초</span>
          </div>
          <input id="rngModalPreheat" class="modal-range" type="range" min="1.0" max="20.0" step="0.5" value="8.0"
                 oninput="document.getElementById('lblModalPreheat').innerText = parseFloat(this.value).toFixed(1) + '초'" />
        </div>

        <div class="slider-group">
          <div class="slider-top">
            <span>시동시간 설정 (최대 4초)</span>
            <span id="lblModalStart" style="color: var(--green); font-size: 20px;">0.8초</span>
          </div>
          <input id="rngModalStart" class="modal-range" type="range" min="0.3" max="4.0" step="0.1" value="0.8"
                 oninput="document.getElementById('lblModalStart').innerText = parseFloat(this.value).toFixed(1) + '초'" />
        </div>
      </div>

      <div class="fs-footer">
        <div class="modal-actions">
          <button type="button" class="m-btn cancel" onclick="cancelSettingsModal()">취소</button>
          <button type="button" class="m-btn confirm" onclick="confirmSettingsModal()">확인</button>
        </div>
        <button type="button" class="m-btn danger" style="width:100%;" onclick="resetSavedDevice()">다른 발전기 선택</button>
      </div>
    </div>
  </div>

  <!-- 발전기 비밀번호 팝업 -->
  <div id="pinModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-title">🔒 발전기 비밀번호 입력</div>
      <div id="pinDesc" style="font-size:14px; color:var(--sub);">
        선택한 발전기 이름의 맨 뒤 숫자 4자리를 입력하세요.
      </div>
      <input id="pinInput" type="tel" maxlength="4" class="pin-input" placeholder="0000" />
      <div class="modal-actions">
        <button class="m-btn cancel" onclick="cancelPinModal()">취소</button>
        <button class="m-btn confirm" onclick="confirmPinModal()">확인</button>
      </div>
    </div>
  </div>

  <div id="errModal" class="modal-backdrop">
    <div class="modal-box" style="border-color: var(--red); text-align: center;">
      <div class="modal-title" style="color: var(--red); font-size: 22px;">⚠️ 시스템 오류</div>
      <div style="font-size: 16px; line-height: 1.6; margin: 8px 0;">
        제어기 통신 및 모듈 점검이 필요합니다.<br/>
        <strong style="color: #f87171; font-size: 20px;">오류코드: x3303</strong>
      </div>
    </div>
  </div>

  <script>
    const SERVICE_UUID        = "12345678-1234-1234-1234-1234567890ab";
    const CHARACTERISTIC_UUID = "abcdefab-1234-5678-1234-abcdefabcdef";

    let bleDevice        = null;
    let bleChar          = null;
    let isConnected      = false;
    let isReconnecting   = false;
    let autoReconTimer   = null;
    let sysLocked        = false;
    let lastCleanName    = "";
    let connectSessionId = 0; // ★ 1번 클릭 즉시 초기화를 보장하는 세션 토큰

    let setPreheatSec   = 8.0; // 기본 예열 8초
    let setStartSec     = 0.8; // 기본 시동 0.8초 (최대 4.0초)
    let curAcVolt       = 0;   // ESP32 수신 원시값 (220V 중간탭 기준)
    let curHz           = 0.0;
    let curDcBatt       = 0.0;
    let curStep1        = 0;
    let curRemainSec    = 0;
    let reserveDraftSec = 0;

    // ★ 전압 생성 시 운전시간 카운트업 타이머
    let genRunStartMs = 0;
    let genRunTimer   = null;

    let cmdQueue = Promise.resolve();
    let pendingPinResolve = null;
    let preheatAnimTimer  = null;
    let startAnimTimer    = null;

    function sanitizeSsid(raw) {
      return String(raw || "").replace(/["'\s]/g, "").trim();
    }

    function extractPinFromName(name) {
      const digits = String(name || "").replace(/\D/g, "");
      return digits.length >= 4 ? digits.slice(-4) : "0000";
    }

    function getStampStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}${m}${day}`;
    }

    function getSavedBleName() {
      const savedName = localStorage.getItem("ble_last_name") || localStorage.getItem("ble_native_device_name") || "";
      const savedId   = localStorage.getItem("ble_last_id") || localStorage.getItem("ble_native_device_id") || "";
      if (!savedName || !savedId) return "";
      const expectedPin = extractPinFromName(savedName);
      if (localStorage.getItem("ble_auth_" + savedName) !== expectedPin) return "";
      return savedName;
    }

    function clearAllBleStorage() {
      try {
        localStorage.removeItem("ble_last_name");
        localStorage.removeItem("ble_last_id");
        localStorage.removeItem("ble_native_device_name");
        localStorage.removeItem("ble_native_device_id");
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith("ble_")) localStorage.removeItem(k);
        });
        localStorage.clear();
      } catch (e) {}
    }

    function clampPct(v) {
      return Math.max(0, Math.min(100, v));
    }

    function formatSecLabel(sec) {
      const n = Math.max(0, Number(sec) || 0);
      return Number.isInteger(Math.round(n * 10) / 10) ? String(Math.round(n)) : n.toFixed(1);
    }

    // ★ 항상 00:00:12 (HH:MM:SS) 6자리 형식으로 표시
    function formatHhMmSs(totalSec) {
      const s = Math.max(0, Math.floor(Number(totalSec) || 0));
      const hrs  = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      return `${String(hrs).padStart(2, "0")}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function isVoltGenerated() {
      return isConnected && !sysLocked && (curAcVolt * 2.0 >= 20.0);
    }

    function updatePreheatUi(sec) {
      document.getElementById("rngPreheat").value = sec;
      if (!isVoltGenerated()) {
        document.getElementById("txtPreheat").innerText = `예열 ${formatSecLabel(sec)}초`;
      }
    }

    function updateStartUi(sec) {
      const clamped = Math.min(4.0, Math.max(0, Number(sec) || 0));
      document.getElementById("rngStart").value = clamped;
      if (!isVoltGenerated()) {
        document.getElementById("txtStart").innerText = `시동 ${clamped.toFixed(1)}초`;
      }
    }

    function renderRunningButtonsUi() {
      if (!isVoltGenerated()) return;
      document.getElementById("txtPreheat").innerText = "가동 중";
      const elapsedSec = genRunStartMs > 0 ? Math.floor((Date.now() - genRunStartMs) / 1000) : 0;
      document.getElementById("txtStart").innerText = formatHhMmSs(elapsedSec);
    }

    function syncRunningTimerState() {
      const btnPreheat = document.getElementById("btnPreheat");
      const btnStart   = document.getElementById("btnStart");

      if (isVoltGenerated()) {
        if (preheatAnimTimer) { clearInterval(preheatAnimTimer); preheatAnimTimer = null; }
        if (startAnimTimer)   { clearInterval(startAnimTimer);   startAnimTimer = null; }
        document.getElementById("rngPreheat").value = setPreheatSec;
        document.getElementById("rngStart").value   = setStartSec;

        btnPreheat.classList.add("running-display");
        btnStart.classList.add("running-display");

        if (genRunStartMs === 0) {
          genRunStartMs = Date.now();
        }
        renderRunningButtonsUi();
        if (!genRunTimer) {
          genRunTimer = setInterval(renderRunningButtonsUi, 500);
        }
      } else {
        if (genRunTimer) {
          clearInterval(genRunTimer);
          genRunTimer = null;
        }
        if (genRunStartMs !== 0) {
          genRunStartMs = 0;
          btnPreheat.classList.remove("running-display");
          btnStart.classList.remove("running-display");
          if (!preheatAnimTimer) updatePreheatUi(setPreheatSec);
          if (!startAnimTimer)   updateStartUi(setStartSec);
        } else {
          btnPreheat.classList.remove("running-display");
          btnStart.classList.remove("running-display");
        }
      }
    }

    // 밧데리 슬라이더: 10(0%) ~ 13(50% 중앙) ~ 15(100%)
    function calcDcSliderPct(v) {
      if (v <= 10) return 0;
      if (v >= 15) return 100;
      if (v <= 13) return ((v - 10) / 3.0) * 50.0;
      return 50.0 + ((v - 13) / 2.0) * 50.0;
    }

    // ★ 100% 실측값 그대로 표시하는 계기판 렌더러
    function renderGauges() {
      const cardAc   = document.getElementById("cardAc");
      const cardHz   = document.getElementById("cardHz");
      const cardDc   = document.getElementById("cardDc");
      const thumbAc  = document.getElementById("thumbAc");
      const thumbHz  = document.getElementById("thumbHz");
      const thumbDc  = document.getElementById("thumbDc");
      const valAcEl  = document.getElementById("valAc");
      const valHzEl  = document.getElementById("valHz");
      const valDcEl  = document.getElementById("valDc");
      const chgBadge = document.getElementById("chgBadge");
      const chgText  = document.getElementById("chgText");

      if (!isConnected || sysLocked) {
        cardAc.classList.add("is-off");
        cardHz.classList.add("is-off");
        cardDc.classList.add("is-off");
        thumbAc.style.left = "0%";
        thumbHz.style.left = "0%";
        thumbDc.style.left = "0%";
        valAcEl.innerText = "0";
        valHzEl.innerText = "0.0";
        valDcEl.innerText = "0.0";
        chgBadge.className = "batt-status";
        chgText.innerText = "대기중";
        return;
      }

      // 1) 발전기 전압 AC (ESP 중간탭 * 2 = 440V 실측 그대로 표시)
      const ac440 = Math.round(curAcVolt * 2.0);
      if (ac440 < 20) {
        cardAc.classList.add("is-off");
        thumbAc.style.left = "0%";
        valAcEl.innerText = "0";
      } else {
        cardAc.classList.remove("is-off");
        const pctAc = clampPct(((ac440 - 400.0) / 80.0) * 100.0);
        thumbAc.style.left = pctAc.toFixed(1) + "%";
        valAcEl.innerText = String(ac440);
      }

      // 2) 엔진 컨디션 / 주파수 (57 ~ 60 ~ 63Hz 실측 그대로 표시)
      if (curHz < 5.0) {
        cardHz.classList.add("is-off");
        thumbHz.style.left = "0%";
        valHzEl.innerText = "0.0";
      } else {
        cardHz.classList.remove("is-off");
        const pctHz = clampPct(((curHz - 57.0) / 6.0) * 100.0);
        thumbHz.style.left = pctHz.toFixed(1) + "%";
        valHzEl.innerText = curHz.toFixed(1);
      }

      // 3) 밧데리 컨디션 / 밧데리 전압 DC (실측 그대로 표시, 13.5V 이상만 충전중)
      if (curDcBatt < 5.0) {
        cardDc.classList.add("is-off");
        thumbDc.style.left = "0%";
        valDcEl.innerText = "0.0";
        chgBadge.className = "batt-status";
        chgText.innerText = "대기중";
      } else {
        cardDc.classList.remove("is-off");
        const pctDc = clampPct(calcDcSliderPct(curDcBatt));
        thumbDc.style.left = pctDc.toFixed(1) + "%";
        valDcEl.innerText = curDcBatt.toFixed(1);
        if (curDcBatt >= 13.5) {
          chgBadge.className = "batt-status charging";
          chgText.innerText = "충전중";
        } else {
          chgBadge.className = "batt-status";
          chgText.innerText = "대기중";
        }
      }
    }

    async function sendBleCmd(cmd, preferNoResp = false) {
      if (!bleChar || !isConnected || sysLocked) return;
      cmdQueue = cmdQueue.then(async () => {
        if (!bleChar || !isConnected || sysLocked) return;
        try {
          const enc = new TextEncoder();
          const data = enc.encode(cmd);
          if (preferNoResp && bleChar.writeValueWithoutResponse) {
            await bleChar.writeValueWithoutResponse(data);
          } else {
            await bleChar.writeValue(data);
          }
          await new Promise(r => setTimeout(r, 35));
        } catch (e) {
          console.warn("BLE write err:", e);
        }
      });
      return cmdQueue;
    }

    async function connectGattAndSubscribe(device, cleanName, sessionToken) {
      if (sysLocked) return false;
      const mySession = (sessionToken !== undefined) ? sessionToken : connectSessionId;
      try {
        bleDevice = device;
        lastCleanName = cleanName || sanitizeSsid(device.name || localStorage.getItem("ble_last_name") || "korea0000");

        bleDevice.removeEventListener("gattserverdisconnected", onDisconnected);
        bleDevice.addEventListener("gattserverdisconnected", onDisconnected);

        const server = await bleDevice.gatt.connect();
        if (mySession !== connectSessionId) {
          clearAllBleStorage();
          try { device.gatt.disconnect(); } catch (e) {}
          return false;
        }

        const service = await server.getPrimaryService(SERVICE_UUID);
        bleChar = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await bleChar.startNotifications();
        if (mySession !== connectSessionId) {
          clearAllBleStorage();
          try { device.gatt.disconnect(); } catch (e) {}
          return false;
        }

        bleChar.removeEventListener("characteristicvaluechanged", onBleNotify);
        bleChar.addEventListener("characteristicvaluechanged", onBleNotify);

        isConnected = true;
        isReconnecting = false;
        if (autoReconTimer) {
          clearTimeout(autoReconTimer);
          autoReconTimer = null;
        }

        localStorage.setItem("ble_last_name", lastCleanName);
        if (device.id) localStorage.setItem("ble_last_id", device.id);

        updateConnectionUi(lastCleanName);

        await sendBleCmd("DATE_" + getStampStr());
        await sendBleCmd("REQ_SYNC");
        return true;
      } catch (err) {
        if (mySession !== connectSessionId) {
          clearAllBleStorage();
        }
        return false;
      }
    }

    function scheduleAutoReconnect() {
      if (sysLocked || isConnected || !bleDevice) return;
      if (autoReconTimer) clearTimeout(autoReconTimer);

      const mySession = connectSessionId;
      isReconnecting = true;
      updateConnectionUi(lastCleanName);

      autoReconTimer = setTimeout(async () => {
        if (mySession !== connectSessionId || sysLocked || isConnected || !bleDevice) return;
        const ok = await connectGattAndSubscribe(bleDevice, lastCleanName, mySession);
        if (mySession === connectSessionId && !ok && !isConnected && !sysLocked && bleDevice) {
          scheduleAutoReconnect();
        }
      }, 1800);
    }

    async function tryAutoConnectSavedDevice() {
      if (sysLocked || isConnected || !navigator.bluetooth) {
        updateConnectionUi(lastCleanName);
        return;
      }
      const savedName = getSavedBleName();
      const savedId   = localStorage.getItem("ble_last_id") || localStorage.getItem("ble_native_device_id") || "";
      if (!savedName || !savedId) {
        updateConnectionUi("");
        return;
      }

      const mySession = connectSessionId;
      lastCleanName = savedName;
      isReconnecting = true;
      updateConnectionUi(savedName);

      if (typeof navigator.bluetooth.getDevices === "function") {
        try {
          const devices = await navigator.bluetooth.getDevices();
          if (mySession !== connectSessionId) return;
          if (devices && devices.length > 0) {
            let target = devices.find(d => (savedId && d.id === savedId) || sanitizeSsid(d.name) === savedName) || devices[0];
            if (target && mySession === connectSessionId) {
              const tName = sanitizeSsid(target.name || savedName);
              lastCleanName = tName;
              bleDevice = target;
              updateConnectionUi(tName);
              const ok = await connectGattAndSubscribe(target, tName, mySession);
              if (mySession === connectSessionId && !ok) {
                if (typeof target.watchAdvertisements === "function") {
                  target.addEventListener("advertisementreceived", async () => {
                    if (mySession === connectSessionId && !isConnected && !sysLocked && bleDevice) {
                      await connectGattAndSubscribe(target, tName, mySession);
                    }
                  });
                  try { await target.watchAdvertisements(); } catch (e) {}
                }
                scheduleAutoReconnect();
              }
            }
          }
        } catch (e) {
          console.warn("Auto getDevices err:", e);
        }
      }
    }

    async function handleConnectClick() {
      if (sysLocked) return;
      if (!navigator.bluetooth) {
        alert("이 브라우저는 블루투스(WebBLE)를 지원하지 않습니다. 안드로이드 Chrome 브라우저로 열어주세요.");
        return;
      }

      if (isConnected && bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
        await sendBleCmd("REQ_SYNC");
        return;
      }

      const mySession = connectSessionId;
      if (bleDevice) {
        isReconnecting = true;
        updateConnectionUi(lastCleanName);
        const ok = await connectGattAndSubscribe(bleDevice, lastCleanName, mySession);
        if (ok || mySession !== connectSessionId) return;
      }

      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "korea" }],
          optionalServices: [SERVICE_UUID]
        });

        const cleanName = sanitizeSsid(device.name || "korea0000");
        const expectedPin = extractPinFromName(cleanName);
        const savedAuth = localStorage.getItem("ble_auth_" + cleanName);

        if (savedAuth !== expectedPin) {
          const userPin = await askPinModal(cleanName);
          if (userPin === null) {
            updateConnectionUi(lastCleanName);
            return;
          }
          const cleanInput = String(userPin).replace(/\D/g, "").slice(-4);
          if (cleanInput !== expectedPin) {
            alert("비밀번호 4자리가 일치하지 않습니다.");
            updateConnectionUi(lastCleanName);
            return;
          }
          localStorage.setItem("ble_auth_" + cleanName, expectedPin);
        }

        if (autoReconTimer) {
          clearTimeout(autoReconTimer);
          autoReconTimer = null;
        }
        if (bleDevice && bleDevice.id !== device.id && bleDevice.gatt) {
          try { bleDevice.gatt.disconnect(); } catch (e) {}
        }

        const newSession = ++connectSessionId;
        lastCleanName = cleanName;
        isReconnecting = true;
        updateConnectionUi(cleanName);

        const ok = await connectGattAndSubscribe(device, cleanName, newSession);
        if (!ok && newSession === connectSessionId) {
          scheduleAutoReconnect();
        }
      } catch (err) {
        console.warn("BLE connect canceled/failed:", err);
        updateConnectionUi(lastCleanName);
      }
    }

    function onDisconnected() {
      isConnected = false;
      bleChar = null;
      curAcVolt = 0;
      curHz = 0.0;
      curDcBatt = 0.0;
      curRemainSec = 0;
      document.getElementById("settingsModal").classList.remove("show");
      document.getElementById("reserveModal").classList.remove("show");
      renderAutoStopRemain(0);
      syncRunningTimerState();
      updateConnectionUi(lastCleanName);
      if (!sysLocked && bleDevice) {
        scheduleAutoReconnect();
      }
    }

    function updateConnectionUi(devName) {
      const dot         = document.getElementById("statusDot");
      const txt         = document.getElementById("statusText");
      const btnSettings = document.getElementById("btnSettings");
      const hasSaved    = Boolean(getSavedBleName() || bleDevice || isReconnecting);

      if (isConnected && !sysLocked) {
        dot.className = "status-dot on";
        txt.innerText = devName || lastCleanName || "연결됨";
        btnSettings.disabled = false;
        document.getElementById("btnStop").disabled = false;
        updateActionButtonsLock();
        renderGauges();
      } else if (sysLocked) {
        dot.className = "status-dot";
        txt.innerText = "시스템 잠금 (x3303)";
        btnSettings.disabled = true;
        document.getElementById("btnPreheat").disabled = true;
        document.getElementById("btnStart").disabled = true;
        document.getElementById("btnReserveStop").disabled = true;
        document.getElementById("btnStop").disabled = true;
        renderGauges();
      } else if (hasSaved) {
        dot.className = "status-dot wait";
        txt.innerText = "연결 중";
        btnSettings.disabled = true;
        document.getElementById("btnPreheat").disabled = true;
        document.getElementById("btnStart").disabled = true;
        document.getElementById("btnReserveStop").disabled = true;
        document.getElementById("btnStop").disabled = true;
        renderGauges();
      } else {
        dot.className = "status-dot";
        txt.innerText = "연결하기";
        btnSettings.disabled = true;
        document.getElementById("btnPreheat").disabled = true;
        document.getElementById("btnStart").disabled = true;
        document.getElementById("btnReserveStop").disabled = true;
        document.getElementById("btnStop").disabled = true;
        renderGauges();
      }
    }

    function triggerLockdown() {
      connectSessionId++;
      sysLocked = true;
      isReconnecting = false;
      if (autoReconTimer) {
        clearTimeout(autoReconTimer);
        autoReconTimer = null;
      }
      document.getElementById("settingsModal").classList.remove("show");
      document.getElementById("reserveModal").classList.remove("show");
      document.getElementById("errModal").classList.add("show");
      if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
        try { bleDevice.gatt.disconnect(); } catch (e) {}
      }
      bleDevice = null;
      onDisconnected();
    }

    function onBleNotify(event) {
      const dec = new TextDecoder("utf-8");
      const raw = dec.decode(event.target.value).trim();
      if (!raw) return;

      const lines = raw.split(/\r?\n/);
      for (const line of lines) {
        parsePacket(line.trim());
      }
    }

    function parsePacket(msg) {
      if (msg === "err_x3303") {
        triggerLockdown();
        return;
      }
      if (sysLocked) return;

      if (msg.startsWith("r1_")) {
        const v = parseFloat(msg.substring(3));
        if (!isNaN(v)) {
          setPreheatSec = v;
          if (!preheatAnimTimer) updatePreheatUi(v);
        }
      } else if (msg.startsWith("r2_")) {
        let v = parseFloat(msg.substring(3));
        if (!isNaN(v)) {
          if (v > 4.0) v = 4.0;
          setStartSec = v;
          if (!startAnimTimer) updateStartUi(v);
        }
      } else if (msg.startsWith("off_")) {
        const sec = parseInt(msg.substring(4), 10) || 0;
        renderAutoStopRemain(sec);
      } else if (msg.startsWith("st_")) {
        const parts = msg.substring(3).split(",");
        if (parts.length >= 6) {
          curAcVolt   = parseFloat(parts[0]) || 0;
          curHz       = parseFloat(parts[1]) || 0;
          curDcBatt   = parseFloat(parts[2]) || 0;
          curStep1    = parseInt(parts[4], 10) === 1 ? 1 : 0;
          const remSec = parseInt(parts[5], 10) || 0;

          renderGauges();
          syncRunningTimerState();
          renderAutoStopRemain(remSec);
          updateActionButtonsLock();
        }
      }
    }

    function updateActionButtonsLock() {
      if (!isConnected || sysLocked) return;
      const acDetected = (curAcVolt >= 15 || curHz >= 10);
      const voltOn     = isVoltGenerated();
      document.getElementById("btnPreheat").disabled     = acDetected;
      document.getElementById("btnStart").disabled       = acDetected;
      document.getElementById("btnReserveStop").disabled = !voltOn;
    }

    function renderAutoStopRemain(sec) {
      curRemainSec = Math.max(0, parseInt(sec, 10) || 0);
      const btn = document.getElementById("btnReserveStop");
      const txt = document.getElementById("txtReserveStop");
      if (curRemainSec > 0 && isVoltGenerated()) {
        btn.classList.add("active-cancel");
        txt.innerText = `예약 정지 취소 ${formatHhMmSs(curRemainSec)}`;
      } else {
        btn.classList.remove("active-cancel");
        txt.innerText = "예약 정지 설정 00:00:00";
      }
    }

    function stopPreheatCountdown() {
      if (preheatAnimTimer) {
        clearInterval(preheatAnimTimer);
        preheatAnimTimer = null;
      }
      updatePreheatUi(setPreheatSec);
    }

    function stopStartCountdown() {
      if (startAnimTimer) {
        clearInterval(startAnimTimer);
        startAnimTimer = null;
      }
      updateStartUi(setStartSec);
    }

    function triggerPreheat() {
      if (curAcVolt >= 15 || curHz >= 10) return;
      stopPreheatCountdown();
      const totalMs = setPreheatSec * 1000;
      const startMs = Date.now();
      const rng = document.getElementById("rngPreheat");
      const txt = document.getElementById("txtPreheat");

      preheatAnimTimer = setInterval(() => {
        if (curAcVolt >= 15 || curHz >= 10) {
          stopPreheatCountdown();
          return;
        }
        const remMs = Math.max(0, totalMs - (Date.now() - startMs));
        const remSec = remMs / 1000.0;
        rng.value = remSec.toFixed(1);
        txt.innerText = `예열 ${remSec.toFixed(1)}초`;
        if (remMs <= 0) {
          stopPreheatCountdown();
        }
      }, 80);

      sendBleCmd("CMD_PREHEAT");
    }

    function triggerStart() {
      if (curAcVolt >= 15 || curHz >= 10) return;
      stopStartCountdown();
      const totalMs = setStartSec * 1000;
      const startMs = Date.now();
      const rng = document.getElementById("rngStart");
      const txt = document.getElementById("txtStart");

      startAnimTimer = setInterval(() => {
        if (curAcVolt >= 15 || curHz >= 10) {
          stopStartCountdown();
          return;
        }
        const remMs = Math.max(0, totalMs - (Date.now() - startMs));
        const remSec = remMs / 1000.0;
        rng.value = remSec.toFixed(1);
        txt.innerText = `시동 ${remSec.toFixed(1)}초`;
        if (remMs <= 0) {
          stopStartCountdown();
        }
      }, 60);

      sendBleCmd("CMD_START");
    }

    function triggerStop() {
      stopPreheatCountdown();
      stopStartCountdown();
      sendBleCmd("CMD_STOP_" + getStampStr(), true);
    }

    /* ══════ 예약 정지 설정(전체화면) / 예약 정지 즉시 취소 ══════ */
    async function handleReserveBtnClick() {
      if (!isVoltGenerated()) return;
      if (curRemainSec > 0) {
        renderAutoStopRemain(0);
        await sendBleCmd("OFF_ADD_0");
        return;
      }
      reserveDraftSec = 0;
      document.getElementById("rngReserveSec").value = 0;
      document.getElementById("lblReserveModalTime").innerText = "00:00:00";
      document.getElementById("reserveModal").classList.add("show");
    }

    function onReserveSliderChange(val) {
      reserveDraftSec = Math.max(0, Math.min(43200, parseInt(val, 10) || 0));
      document.getElementById("lblReserveModalTime").innerText = formatHhMmSs(reserveDraftSec);
    }

    function addReserveDraftSec(addSec) {
      reserveDraftSec = Math.max(0, Math.min(43200, reserveDraftSec + addSec));
      document.getElementById("rngReserveSec").value = reserveDraftSec;
      document.getElementById("lblReserveModalTime").innerText = formatHhMmSs(reserveDraftSec);
    }

    function closeReserveModal() {
      document.getElementById("reserveModal").classList.remove("show");
    }

    async function confirmReserveModal() {
      const targetSec = Math.max(0, Math.min(43200, reserveDraftSec));
      document.getElementById("reserveModal").classList.remove("show");
      renderAutoStopRemain(targetSec);
      await sendBleCmd("OFF_ADD_0");
      if (targetSec > 0) {
        await sendBleCmd("OFF_ADD_" + targetSec);
      }
    }

    /* ══════ 비밀번호 모달 ══════ */
    function askPinModal(devName) {
      return new Promise((resolve) => {
        pendingPinResolve = resolve;
        document.getElementById("pinDesc").innerText =
          `선택한 발전기(${devName})의 맨 뒤 숫자 4자리를 입력하세요.`;
        const inp = document.getElementById("pinInput");
        inp.value = "";
        document.getElementById("pinModal").classList.add("show");
        setTimeout(() => inp.focus(), 100);
      });
    }

    function cancelPinModal() {
      document.getElementById("pinModal").classList.remove("show");
      if (pendingPinResolve) pendingPinResolve(null);
      pendingPinResolve = null;
    }

    function confirmPinModal() {
      const val = document.getElementById("pinInput").value;
      document.getElementById("pinModal").classList.remove("show");
      if (pendingPinResolve) pendingPinResolve(val);
      pendingPinResolve = null;
    }

    /* ══════ 설정 전체화면 창 (예열 8초 / 시동 0.8초·최대 4초) ══════ */
    function openSettingsModal() {
      if (!isConnected || sysLocked) return;
      document.getElementById("rngModalPreheat").value = setPreheatSec;
      document.getElementById("lblModalPreheat").innerText = setPreheatSec.toFixed(1) + "초";
      document.getElementById("rngModalStart").value = setStartSec;
      document.getElementById("lblModalStart").innerText = setStartSec.toFixed(1) + "초";
      document.getElementById("settingsModal").classList.add("show");
    }

    function cancelSettingsModal() {
      document.getElementById("settingsModal").classList.remove("show");
    }

    async function confirmSettingsModal() {
      let r1 = parseFloat(document.getElementById("rngModalPreheat").value);
      let r2 = parseFloat(document.getElementById("rngModalStart").value);
      if (isNaN(r1) || r1 < 1.0) r1 = 1.0;
      if (r1 > 20.0) r1 = 20.0;
      if (isNaN(r2) || r2 < 0.3) r2 = 0.3;
      if (r2 > 4.0) r2 = 4.0;

      setPreheatSec = r1;
      setStartSec   = r2;
      updatePreheatUi(r1);
      updateStartUi(r2);

      document.getElementById("settingsModal").classList.remove("show");

      await sendBleCmd("RELAY1_" + r1.toFixed(1));
      await sendBleCmd("RELAY2_" + r2.toFixed(1));
    }

    // ★ 단 1번 클릭으로 진행 중인 연결까지 즉시 끊고 완벽 초기화
    async function resetSavedDevice() {
      connectSessionId++;
      document.getElementById("settingsModal").classList.remove("show");

      if (autoReconTimer) {
        clearTimeout(autoReconTimer);
        autoReconTimer = null;
      }
      const prevDev = bleDevice;
      bleDevice = null;
      bleChar = null;
      isReconnecting = false;
      isConnected = false;
      lastCleanName = "";
      curAcVolt = 0;
      curHz = 0.0;
      curDcBatt = 0.0;
      curRemainSec = 0;

      clearAllBleStorage();
      renderAutoStopRemain(0);
      syncRunningTimerState();
      updateConnectionUi("");

      if (prevDev) {
        try {
          prevDev.removeEventListener("gattserverdisconnected", onDisconnected);
          if (prevDev.gatt) prevDev.gatt.disconnect();
        } catch (e) {}
      }
      if (typeof window.__bleNativeReset === "function") {
        try { await window.__bleNativeReset(); } catch (e) {}
      }
      clearAllBleStorage();
      updateConnectionUi("");
      setTimeout(() => {
        clearAllBleStorage();
        updateConnectionUi("");
      }, 350);
    }

    window.addEventListener("DOMContentLoaded", () => {
      tryAutoConnectSavedDevice();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && !isConnected && !sysLocked && bleDevice) {
        scheduleAutoReconnect();
      }
    });
  </script>
</body>
</html>
