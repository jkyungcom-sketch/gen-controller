name: Build APK

# ── 2트랙 분리 ─────────────────────────────────────────────
#  track=test  : 테스트 APK (test-latest pre-release) — main 브랜치/latest 절대 안 건드림
#  track=release: 정식 APK  (latest release)            — main 브랜치 푸시로 트리거
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'test = 테스트APK / release = 정식APK'
        required: true
        default: 'test'
        type: choice
        options: [test, release]
      ks_url:
        description: 'keystore 1회용 다운로드 URL'
        required: false
      ks_pass:
        description: 'keystore store 비밀번호'
        required: false
      ks_alias:
        description: 'keystore alias'
        required: false
        default: 'jkyung'
      ks_sha256:
        description: 'keystore 인증서 SHA256 지문 (콜론 없이)'
        required: false

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.t.outputs.track }}
    steps:
      - id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "track=${{ inputs.track }}" >> $GITHUB_OUTPUT
          else
            echo "track=release" >> $GITHUB_OUTPUT
          fi

  build:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      TRACK: ${{ needs.resolve.outputs.track }}
    steps:
      - name: Track 정보
        run: |
          echo "TRACK = $TRACK"
          if [ "$TRACK" = "test" ]; then
            echo "APK_NAME=generator-test.apk"   >> $GITHUB_ENV
            echo "TAG=test-latest"               >> $GITHUB_ENV
            echo "REL_TITLE=🧪 테스트 빌드 (검증용)" >> $GITHUB_ENV
            echo "IS_PRE=true"                   >> $GITHUB_ENV
          else
            echo "APK_NAME=generator-remote.apk" >> $GITHUB_ENV
            echo "TAG=latest"                    >> $GITHUB_ENV
            echo "REL_TITLE=발전기 리모컨 최신판" >> $GITHUB_ENV
            echo "IS_PRE=false"                  >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Capacitor deps
        run: |
          set -e
          npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android
          npm i --no-audit --no-fund @capacitor-community/bluetooth-le @capacitor/preferences

      # ★ 요구사항 3: 네이티브 BLE 어댑터를 별도 파일로 주입
      #   순수 웹 index.html 을 통째로 붙여넣어도 빌드 시 자동으로 script 주입됨
      - name: Prepare web assets (inject BLE adapter)
        run: |
          set -e
          rm -rf www && mkdir -p www
          cp index.html www/index.html
          if [ -f ble-native-adapter.js ]; then
            cp ble-native-adapter.js www/ble-native-adapter.js
            python3 scripts/inject_adapter.py www/index.html
          else
            echo "::warning::ble-native-adapter.js 없음 — 어댑터 미주입"
          fi
          ls -la www/

      # ★ 요구사항 2: 고정 Release 서명키 (rieul 1회용 토큰 HTTPS 수신)
      #   레포(public)에 keystore/비번을 전혀 남기지 않는 방식.
      #   KS_URL 은 workflow_dispatch inputs 로 전달되며 빌드 후 즉시 폐기됨.
      - name: Restore release keystore
        env:
          KS_URL: ${{ inputs.ks_url }}
          KS_PASS: ${{ inputs.ks_pass }}
          KS_ALIAS: ${{ inputs.ks_alias }}
        run: |
          set -e
          if [ -z "$KS_URL" ]; then
            echo "::error::ks_url 입력값이 없습니다 (서명 빌드 불가)"
            exit 1
          fi
          curl -fsSL --retry 3 --retry-delay 2 "$KS_URL" -o android-release.jks
          test -s android-release.jks
          echo "KEYSTORE_FILE=$PWD/android-release.jks" >> $GITHUB_ENV
          echo "✅ keystore 수신 $(stat -c%s android-release.jks) bytes"
          # 즉시 검증 (비번 맞는지)
          keytool -list -keystore android-release.jks -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null
          echo "✅ keystore 비밀번호/별칭 검증 OK"

      - name: Capacitor init and add android
        run: |
          set -e
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"org.jkyung.generator","appName":"발전기 리모컨","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          npx cap add android || true
          npx cap sync android

      # ★★ 필수: AndroidWifiBridge.java / MainActivity.java 실제 주입
      #    (cap sync 는 java 를 건드리지 않으므로 반드시 sync 이후에 실행)
      #    누락 시 window.AndroidWifiBridge 가 APK 에 존재하지 않아
      #    Wi-Fi 스캔/연결/bindProcessToNetwork 가 전부 죽는다.
      - name: Inject Wi-Fi bridge (AndroidWifiBridge + MainActivity)
        run: |
          set -e
          python3 scripts/patch_wifi_bridge.py
          echo "=== 주입 결과 검증 ==="
          PKG=android/app/src/main/java/org/jkyung/generator
          test -f $PKG/AndroidWifiBridge.java || { echo "::error::AndroidWifiBridge.java 미주입"; exit 1; }
          grep -q 'addJavascriptInterface(wifiBridge, "AndroidWifiBridge")' $PKG/MainActivity.java \
            || { echo "::error::MainActivity 에 브릿지 주입 코드 없음"; exit 1; }
          grep -q 'extends BridgeActivity' $PKG/MainActivity.java \
            || { echo "::error::MainActivity 가 BridgeActivity 미확장"; exit 1; }
          echo "✅ Wi-Fi 브릿지 주입 검증 통과"
          ls -la $PKG/

      - name: Inject BLE permissions
        run: python3 scripts/patch_manifest.py android/app/src/main/AndroidManifest.xml

      # ★ cleartext / Wi-Fi 권한 최종 확인 (patch_wifi_bridge.py 가 이미 넣었지만 멱등 재확인)
      - name: Verify manifest cleartext + wifi permissions
        run: |
          set -e
          MF=android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="true"' $MF \
            || { echo "::error::usesCleartextTraffic 누락 → http://192.168.4.1 차단됨"; exit 1; }
          for P in ACCESS_WIFI_STATE CHANGE_WIFI_STATE ACCESS_NETWORK_STATE CHANGE_NETWORK_STATE; do
            grep -q "android.permission.$P" $MF || { echo "::error::$P 권한 누락"; exit 1; }
          done
          echo "✅ manifest 검증 통과"
          grep -n 'usesCleartextTraffic\|ACCESS_WIFI_STATE\|CHANGE_WIFI_STATE' $MF

      - name: Configure signing
        env:
          KS_PASS: ${{ inputs.ks_pass }}
          KS_ALIAS: ${{ inputs.ks_alias }}
          KS_FILE: ${{ env.KEYSTORE_FILE }}
        run: |
          if [ -z "$KS_FILE" ]; then
            echo "::warning::keystore 없음 → assembleDebug 로 폴백"
            echo "BUILD_TASK=assembleDebug" >> $GITHUB_ENV
          else
            python3 scripts/patch_gradle.py android/app/build.gradle
            echo "BUILD_TASK=assembleRelease" >> $GITHUB_ENV
          fi

      - name: Build APK
        run: |
          set -e
          cd android
          chmod +x gradlew
          echo "사용 태스크: $BUILD_TASK"
          ./gradlew "$BUILD_TASK" --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          mkdir -p out

          # ★ 트랙에 맞는 디렉터리만 엄격히 선택 (debug/release 혼동 원천 차단)
          if [ "$BUILD_TASK" = "assembleRelease" ]; then
            SEARCH_DIR="android/app/build/outputs/apk/release"
            EXPECT_SIGNED="yes"
          else
            SEARCH_DIR="android/app/build/outputs/apk/debug"
            EXPECT_SIGNED="no"
          fi

          echo "BUILD_TASK=$BUILD_TASK"
          echo "SEARCH_DIR=$SEARCH_DIR"
          ls -laR android/app/build/outputs/apk || true

          if [ ! -d "$SEARCH_DIR" ]; then
            echo "::error::$SEARCH_DIR 디렉터리가 없습니다 (빌드 산출물 없음)"
            exit 1
          fi

          SRC=$(find "$SEARCH_DIR" -name "*.apk" -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::$SEARCH_DIR 안에 APK가 없습니다"
            exit 1
          fi
          echo "✅ 선택된 APK: $SRC ($(stat -c%s "$SRC") bytes)"

          cp "$SRC" "out/$APK_NAME"
          echo "APK 크기: $(stat -c%s out/$APK_NAME) bytes"
          echo "SHA256: $(sha256sum out/$APK_NAME | cut -d' ' -f1)"

          echo "=== apksigner 서명 검증 ==="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner 를 찾을 수 없습니다"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "out/$APK_NAME" | head -20

          if [ "$EXPECT_SIGNED" = "yes" ]; then
            if ! "$APKSIGNER" verify "out/$APK_NAME" >/dev/null 2>&1; then
              echo "::error::release APK 서명 검증 실패 — 고정키 서명이 적용되지 않았습니다"
              exit 1
            fi
            echo "✅ Release 서명 검증 통과"

            # ★ 고정키 지문 대조 (빌드 산출물이 우리 키로 서명됐는지 확정)
            WANT_SHA256="${{ inputs.ks_sha256 }}"
            GOT=$("$APKSIGNER" verify --print-certs "out/$APK_NAME" \
                    | grep -i "SHA-256 digest" | head -1 \
                    | sed 's/.*digest: *//' | tr -d ' \r')
            echo "기대 지문: ${WANT_SHA256:- (미지정)}"
            echo "실제 지문: $GOT"
            if [ -n "$WANT_SHA256" ]; then
              NORM_WANT=$(echo "$WANT_SHA256" | tr 'A-F' 'a-f' | tr -d ':')
              NORM_GOT=$(echo "$GOT" | tr 'A-F' 'a-f' | tr -d ':')
              if [ "$NORM_WANT" != "$NORM_GOT" ]; then
                echo "::error::서명 지문 불일치! 기대=$NORM_WANT 실제=$NORM_GOT"
                exit 1
              fi
              echo "✅ 고정키 지문 일치 확인"
            else
              echo "::warning::ks_sha256 미지정 → 지문 대조 생략"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.TRACK }}
          path: out/${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish release (clobber)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "TAG=$TAG / APK_NAME=$APK_NAME / IS_PRE=$IS_PRE"

          # 1) 같은 태그의 릴리스 전부 삭제 (draft 포함)
          IDS=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
                  --jq ".[] | select(.tag_name==\"$TAG\") | .id" 2>/dev/null || true)
          for RID in $IDS; do
            echo "기존 릴리스 삭제: id=$RID tag=$TAG"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$RID" || true
          done

          # 2) 태그 삭제
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" 2>/dev/null || true

          # 3) 생성
          PRE=""
          if [ "$IS_PRE" = "true" ]; then PRE="--prerelease"; fi
          set +e
          gh release create "$TAG" "out/$APK_NAME" \
            --title "$REL_TITLE" \
            --notes "$TRACK 트랙 자동 빌드 / commit ${{ github.sha }}" \
            $PRE --latest=false
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::error::gh release create 실패 (exit $RC)"
            echo "--- 잔여 릴리스 재조회 ---"
            gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq '.[] | "\(.id) \(.tag_name) draft=\(.draft)"' || true
            exit $RC
          fi
          echo "✅ release $TAG 생성 완료"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets
