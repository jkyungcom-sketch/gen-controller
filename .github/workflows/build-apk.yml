name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Android SDK 는 GitHub 러너에 이미 설치되어 있음 (ANDROID_HOME=/usr/local/lib/android/sdk)
      # setup-android 액션은 불필요하며 실패 원인이었음 → 제거
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Capacitor deps
        run: |
          set -e
          npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android
          npm i --no-audit --no-fund @capacitor-community/bluetooth-le @capacitor/preferences

      - name: Prepare web assets
        run: |
          set -e
          rm -rf www && mkdir -p www
          cp index.html www/index.html

      - name: Capacitor init and add android
        run: |
          set -e
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"org.jkyung.generator","appName":"발전기 리모컨","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          npx cap add android || true
          npx cap sync android

      - name: Inject BLE permissions
        run: |
          set -e
          python3 - <<'PYEOF'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
          """
          if "BLUETOOTH_SCAN" not in s:
              s = re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1) + "\n" + perms, s, count=1)
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          open(p, "w", encoding="utf-8").write(s)
          print("manifest patched")
          PYEOF

      - name: Build debug APK
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          find android -name "*.apk" -type f -exec cp {} out/generator-remote.apk \;
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: generator-remote-apk
          path: out/generator-remote.apk
          retention-days: 30

      - name: Publish release (clobber)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh api -X DELETE repos/${{ github.repository }}/releases/tags/latest 2>/dev/null || true
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/latest 2>/dev/null || true
          gh release create latest out/generator-remote.apk \
            --title "발전기 리모컨 최신판" \
            --notes "자동 빌드 (commit ${{ github.sha }})" \
            --latest
